<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmileTrack | Gestión Dental Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .modal { transition: opacity 0.3s ease; }
        .bg-smile-cyan { background-color: #26bad4; }
        .text-smile-cyan { color: #26bad4; }
        .bg-track-navy { background-color: #1b365d; }
        .text-track-navy { color: #1b365d; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased">

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <span class="text-2xl font-bold text-track-navy flex items-center gap-2">
                        <i class="fa-solid fa-tooth text-[#26bad4]"></i> SmileTrack
                    </span>
                </div>
                <button onclick="toggleModal('loginModal')" class="text-track-navy hover:text-smile-cyan font-semibold px-4 py-2 rounded-md transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-user-lock"></i> Log in
                </button>
            </div>
        </div>
    </nav>

    <!-- CABECERA (HERO) -->
    <header class="bg-track-navy text-white text-center py-16 px-4 border-b-4 border-[#26bad4]">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-4">Encuentra a tu especialista ideal</h1>
        <p class="text-lg md:text-xl text-slate-300 max-w-2xl mx-auto">Selecciona a uno de nuestros profesionales para ver sus servicios y agendar tu cita al instante.</p>
    </header>

    <!-- CATÁLOGO DINÁMICO DE DENTISTAS -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div id="catalogoDentistas" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="col-span-full text-center py-12 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p>Cargando especialistas disponibles...</p>
            </div>
        </div>
    </main>

    <!-- MODAL: PERFIL DEL DENTISTA Y SUS SERVICIOS -->
    <div id="dentistModal" class="modal hidden fixed inset-0 bg-slate-900 bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-slate-100 px-6 py-4 flex justify-between items-center z-10">
                <h2 id="modalDentistName" class="text-2xl font-bold text-track-navy">Nombre Dentista</h2>
                <button onclick="toggleModal('dentistModal')" class="text-slate-400 hover:text-smile-cyan text-2xl leading-none">&times;</button>
            </div>
            
            <div class="p-6">
                <p id="modalDentistSpec" class="text-smile-cyan font-medium mb-6">Especialidad</p>
                <h3 class="text-lg font-bold mb-4 text-slate-700">Selecciona un servicio:</h3>
                
                <!-- Lista dinámica de servicios del dentista -->
                <div id="listaServiciosModal" class="space-y-3 mb-8">
                    <!-- Se inyectan con JS -->
                </div>

                <!-- Formulario para agendar (Correo opcional) -->
                <div id="bookingForm" class="hidden bg-cyan-50 p-6 rounded-xl border border-cyan-100">
                    <form onsubmit="event.preventDefault(); alert('¡Solicitud de cita enviada con éxito!'); toggleModal('dentistModal');">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Tu nombre completo</label>
                                <input type="text" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#26bad4] outline-none bg-white">
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">WhatsApp (Obligatorio)</label>
                                    <input type="tel" required placeholder="10 dígitos" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#26bad4] outline-none bg-white">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Correo electrónico <span class="text-xs text-slate-400 font-normal">(Opcional)</span></label>
                                    <input type="email" placeholder="tucorreo@email.com" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#26bad4] outline-none bg-white">
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-smile-cyan hover:bg-[#1fa1b8] text-white font-bold py-3 px-4 rounded-lg transition-colors mt-4 shadow-md">
                                Solicitar Cita con el Especialista
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: LOG IN -->
    <div id="loginModal" class="modal hidden fixed inset-0 bg-slate-900 bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="px-6 py-4 flex justify-end">
                <button onclick="toggleModal('loginModal')" class="text-slate-400 hover:text-smile-cyan text-2xl leading-none">&times;</button>
            </div>
            <div class="px-8 pb-8">
                <div class="text-center mb-8 flex flex-col items-center">
                    <i class="fa-solid fa-tooth text-4xl text-[#26bad4] mb-3"></i>
                    <h2 class="text-2xl font-bold text-track-navy">Acceso a Personal</h2>
                    <p class="text-slate-500 text-sm mt-1">Dentistas y Super Administrador</p>
                </div>
                
                <form onsubmit="event.preventDefault(); window.location.href = 'admin.html';">
                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Usuario / Correo</label>
                            <input type="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#26bad4] outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                            <input type="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#26bad4] outline-none">
                        </div>
                        <button type="submit" class="w-full bg-track-navy hover:bg-[#122543] text-white font-bold py-3 px-4 rounded-lg transition-colors mt-2 shadow-md">
                            Ingresar al Sistema
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- LÓGICA CON FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzaA4eNHIF-azFNkOlulCURdbGHLaY9dw",
            authDomain: "smiletrack-53116.firebaseapp.com",
            projectId: "smiletrack-53116",
            storageBucket: "smiletrack-53116.firebasestorage.app",
            messagingSenderId: "978800884207",
            appId: "1:978800884207:web:378a2291fac086e7745e1a",
            measurementId: "G-XES7XSYE2V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.toggleModal = function(modalID) {
            const modal = document.getElementById(modalID);
            modal.classList.toggle('hidden');
            if (modalID === 'dentistModal' && modal.classList.contains('hidden')) {
                document.getElementById('bookingForm').classList.add('hidden');
            }
        };

        window.openDentistModal = function(nombre, especialidad, servicios) {
            document.getElementById('modalDentistName').innerText = nombre;
            document.getElementById('modalDentistSpec').innerText = especialidad;
            
            const contenedorServicios = document.getElementById('listaServiciosModal');
            contenedorServicios.innerHTML = '';

            if (servicios && servicios.length > 0) {
                servicios.forEach(s => {
                    const label = document.createElement('label');
                    label.className = "flex justify-between items-center p-4 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition-colors";
                    label.innerHTML = `
                        <div class="flex items-center gap-3">
                            <input type="radio" name="servicio" class="w-5 h-5 accent-[#26bad4]" onchange="showForm()">
                            <span class="font-semibold text-slate-700">${s.nombre}</span>
                        </div>
                        <span class="text-smile-cyan font-bold text-sm">${s.precio}</span>
                    `;
                    contenedorServicios.appendChild(label);
                });
            } else {
                contenedorServicios.innerHTML = '<p class="text-sm text-slate-400">Este especialista aún no registra servicios.</p>';
            }

            document.getElementById('bookingForm').classList.add('hidden');
            toggleModal('dentistModal');
        };

        window.showForm = function() {
            document.getElementById('bookingForm').classList.remove('hidden');
            document.getElementById('bookingForm').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        };

        async function cargarCatalogoPublico() {
            const contenedor = document.getElementById('catalogoDentistas');
            try {
                const querySnapshot = await getDocs(collection(db, "dentistas"));
                contenedor.innerHTML = '';

                if (querySnapshot.empty) {
                    contenedor.innerHTML = '<div class="col-span-full text-center py-12 text-slate-400">No hay especialistas registrados en este momento.</div>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const datos = doc.data();
                    
                    // Verificamos si el usuario guardó una foto real propia (Base64 o enlace válido)
                    let contenidoImagenHTML = '';
                    if (datos.foto && datos.foto.trim() !== "") {
                        contenidoImagenHTML = `<img src="${datos.foto}" alt="${datos.nombre}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">`;
                    } else {
                        // Si no tiene foto, mostramos un diseño profesional con sus iniciales
                        const iniciales = (datos.nombre || 'DR').replace(/^Dr\.\s*|Dra\.\s*/i, '').substring(0, 2).toUpperCase();
                        contenidoImagenHTML = `
                            <div class="w-full h-full bg-gradient-to-br from-slate-800 to-track-navy flex flex-col items-center justify-center text-white">
                                <i class="fa-solid fa-user-doctor text-4xl text-[#26bad4] mb-2"></i>
                                <span class="font-bold text-lg tracking-wider">${iniciales}</span>
                            </div>
                        `;
                    }

                    const tarjeta = document.createElement('div');
                    tarjeta.className = "bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-lg transition-shadow cursor-pointer group";
                    tarjeta.onclick = () => openDentistModal(datos.nombre, datos.especialidad, datos.servicios);
                    
                    tarjeta.innerHTML = `
                        <div class="h-48 bg-slate-200 overflow-hidden relative">
                            ${contenidoImagenHTML}
                        </div>
                        <div class="p-6 text-center">
                            <h3 class="text-xl font-bold text-track-navy">${datos.nombre}</h3>
                            <p class="text-smile-cyan font-medium mb-4">${datos.especialidad}</p>
                            <span class="inline-block bg-cyan-50 text-smile-cyan rounded-full px-4 py-2 text-sm font-semibold border border-cyan-100">Ver servicios y agendar</span>
                        </div>
                    `;
                    contenedor.appendChild(tarjeta);
                });

            } catch (error) {
                console.error(error);
                contenedor.innerHTML = '<div class="col-span-full text-center py-12 text-red-500">Error al cargar el catálogo de especialistas.</div>';
            }
        }

        cargarCatalogoPublico();
    </script>
</body>
</html>
