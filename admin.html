<!-- SCRIPTS DE LÓGICA CON FIREBASE (CON TU CONFIGURACIÓN) -->
    <script type="module">
        // 1. Importar Firebase directamente desde Google para archivos HTML (CDN)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 2. TU CONFIGURACIÓN EXACTA DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAzaA4eNHIF-azFNkOlulCURdbGHLaY9dw",
            authDomain: "smiletrack-53116.firebaseapp.com",
            projectId: "smiletrack-53116",
            storageBucket: "smiletrack-53116.firebasestorage.app",
            messagingSenderId: "978800884207",
            appId: "1:978800884207:web:378a2291fac086e7745e1a",
            measurementId: "G-XES7XSYE2V"
        };

        // 3. Inicializar Firebase y la Base de Datos
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- FUNCIONES DE LA INTERFAZ ---
        
        // Función para abrir/cerrar el modal
        window.toggleModal = function(modalID) {
            const modal = document.getElementById(modalID);
            modal.classList.toggle('hidden');
            if (modal.classList.contains('hidden')) {
                document.getElementById('formNuevoUsuario').reset();
            }
        };

        // --- ELIMINAR DENTISTA DE LA BASE DE DATOS ---
        window.eliminarFila = async function(boton, idFirebase) {
            if(confirm("¿Estás seguro de que deseas eliminar a este usuario de la base de datos?")) {
                try {
                    if (idFirebase) {
                        // Borra el dato en la nube de Firebase
                        await deleteDoc(doc(db, "dentistas", idFirebase));
                    }
                    // Lo borra visualmente de tu pantalla
                    boton.closest('tr').remove();
                } catch (error) {
                    alert("Hubo un error al eliminar el registro: " + error.message);
                }
            }
        };

        // --- GUARDAR NUEVO DENTISTA EN FIREBASE ---
        window.registrarUsuario = async function(event) {
            event.preventDefault();

            // Cambiar el texto del botón mientras carga
            const btnSubmit = event.target.querySelector('button[type="submit"]');
            const textoOriginal = btnSubmit.innerHTML;
            btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';
            btnSubmit.disabled = true;

            const nombre = document.getElementById('inputNombre').value;
            const correo = document.getElementById('inputCorreo').value;
            const especialidad = document.getElementById('inputEspecialidad').value;

            try {
                // 1. Enviar la información a la colección "dentistas" en Firestore
                const docRef = await addDoc(collection(db, "dentistas"), {
                    nombre: nombre,
                    correo: correo,
                    especialidad: especialidad,
                    estado: "Activo",
                    fechaRegistro: new Date()
                });

                // 2. Mostrar al nuevo dentista en la tabla de tu pantalla
                const nuevaFila = document.createElement('tr');
                nuevaFila.className = "hover:bg-slate-50 transition-colors";
                nuevaFila.innerHTML = `
                    <td class="px-6 py-4">
                        <p class="font-bold text-slate-800">${nombre}</p>
                        <p class="text-sm text-slate-500">${correo}</p>
                    </td>
                    <td class="px-6 py-4 text-slate-600">${especialidad}</td>
                    <td class="px-6 py-4">
                        <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold">Activo</span>
                    </td>
                    <td class="px-6 py-4 text-right space-x-2">
                        <button class="text-slate-400 hover:text-smile-cyan transition-colors" title="Editar"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="eliminarFila(this, '${docRef.id}')" class="text-slate-400 hover:text-red-500 transition-colors" title="Eliminar"><i class="fa-solid fa-ban"></i></button>
                    </td>
                `;
                
                document.getElementById('cuerpoTabla').appendChild(nuevaFila);

                // 3. Restaurar la ventana y el botón
                window.toggleModal('createUserModal');
                btnSubmit.innerHTML = textoOriginal;
                btnSubmit.disabled = false;

                // Mensaje de éxito
                alert("¡Dentista registrado exitosamente en la base de datos!");

            } catch (error) {
                alert("Error de conexión con Firebase: " + error.message);
                btnSubmit.innerHTML = textoOriginal;
                btnSubmit.disabled = false;
            }
        };
    </script>
