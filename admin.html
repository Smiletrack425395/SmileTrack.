<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmileTrack | Mi Panel de Especialista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-smile-cyan { background-color: #26bad4; }
        .text-smile-cyan { color: #26bad4; }
        .bg-track-navy { background-color: #1b365d; }
        .text-track-navy { color: #1b365d; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased flex h-screen overflow-hidden">

    <!-- MENÚ LATERAL -->
    <aside class="w-64 bg-track-navy text-white flex flex-col shadow-xl z-20">
        <div class="h-20 flex items-center justify-center border-b border-slate-700 px-6">
            <i class="fa-solid fa-tooth text-[#26bad4] text-2xl mr-3"></i>
            <span class="text-2xl font-bold tracking-tight">SmileTrack</span>
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-[#26bad4] text-white rounded-lg font-medium transition-colors shadow-md">
                <i class="fa-solid fa-user-gear w-5"></i> Mi Perfil y Servicios
            </a>
            <a href="#" onclick="alert('Apartado de Solicitudes de Citas')" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg font-medium transition-colors">
                <i class="fa-solid fa-clock-rotate-left w-5"></i> Solicitudes de Citas
            </a>
            <a href="#" onclick="alert('Módulo de Citas')" class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg font-medium transition-colors">
                <i class="fa-solid fa-calendar-check w-5"></i> Citas
            </a>
        </nav>

        <div class="p-4 border-t border-slate-700">
            <div class="flex items-center gap-3 px-4 py-3 text-sm text-slate-300">
                <div class="w-8 h-8 rounded-full bg-[#26bad4] flex items-center justify-center text-white font-bold" id="sidebarAvatar">DR</div>
                <div>
                    <p class="font-bold text-white truncate max-w-[140px]" id="sidebarNombre">Especialista</p>
                </div>
            </div>
            <button onclick="window.location.href='index.html'" class="w-full mt-2 flex items-center justify-center gap-2 px-4 py-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors text-sm">
                <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
            </button>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL: EDITAR PERFIL PROPIO -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="h-20 bg-white shadow-sm flex items-center justify-between px-8 z-10 sticky top-0">
            <h1 class="text-2xl font-bold text-track-navy">Configuración de mi Perfil</h1>
        </header>

        <div class="p-8 max-w-4xl mx-auto w-full">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8">
                
                <form id="formMiPerfil" onsubmit="guardarMiPerfil(event)">
                    <!-- ID oculto del registro -->
                    <input type="hidden" id="inputIdFirebase">

                    <div class="flex items-center gap-6 mb-8 pb-6 border-b border-slate-100">
                        <div class="w-24 h-24 rounded-full bg-slate-100 border-2 border-slate-200 overflow-hidden flex items-center justify-center relative shadow-inner">
                            <img id="previewFoto" src="" alt="Foto perfil" class="w-full h-full object-cover hidden">
                            <i id="previewIcon" class="fa-solid fa-user-doctor text-4xl text-slate-300"></i>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">Fotografía del Doctor (Desde tu equipo)</label>
                            <input type="file" id="inputArchivoFoto" accept="image/*" onchange="comprimirYConvertirImagen(event)" class="text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-cyan-50 file:text-smile-cyan hover:file:bg-cyan-100 cursor-pointer">
                            <input type="hidden" id="inputFotoBase64">
                            <p class="text-xs text-slate-400 mt-1">Se optimizará automáticamente para ajustarse al sistema.</p>
                        </div>
                    </div>

                    <h3 class="text-sm font-bold text-smile-cyan uppercase tracking-wider mb-4">Información Personal y Acceso</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Nombre completo</label>
                            <input type="text" id="inputNombre" required placeholder="Ej. Yatziri Leal" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#26bad4] outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Especialidad</label>
                            <select id="inputEspecialidad" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#26bad4] outline-none bg-white">
                                <option value="" disabled selected>Selecciona una especialidad...</option>
                                <option value="Odontología General">Odontología General</option>
                                <option value="Ortodoncia">Ortodoncia</option>
                                <option value="Endodoncia">Endodoncia</option>
                                <option value="Cirugía Maxilofacial">Cirugía Maxilofacial</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
                            <input type="email" id="inputCorreo" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#26bad4] outline-none bg-slate-50">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Mi Contraseña</label>
                            <input type="text" id="inputPassword" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#26bad4] outline-none">
                        </div>
                    </div>

                    <!-- SERVICIOS Y PRECIOS -->
                    <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-2">
                        <h3 class="text-sm font-bold text-smile-cyan uppercase tracking-wider">Mis Servicios y Costos</h3>
                        <button type="button" onclick="agregarCampoServicio()" class="bg-cyan-50 text-smile-cyan hover:bg-cyan-100 px-3 py-1 rounded-md text-xs font-bold transition-colors">
                            <i class="fa-solid fa-plus"></i> Añadir Servicio
                        </button>
                    </div>
                    
                    <div id="contenedorServiciosDinamicos" class="space-y-3 mb-8">
                        <!-- Servicios inyectados con JS -->
                    </div>

                    <div class="flex justify-end pt-4 border-t border-slate-100">
                        <button type="submit" id="btnSubmit" class="px-6 py-3 bg-smile-cyan hover:bg-[#1fa1b8] text-white font-bold rounded-lg transition-colors shadow-md flex items-center gap-2">
                            <i class="fa-solid fa-save"></i> Guardar Cambios en mi Perfil
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <!-- CONEXIÓN A FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzaA4eNHIF-azFNkOlulCURdbGHLaY9dw",
            authDomain: "smiletrack-53116.firebaseapp.com",
            projectId: "smiletrack-53116",
            storageBucket: "smiletrack-53116.firebasestorage.app",
            messagingSenderId: "978800884207",
            appId: "1:978800884207:web:378a2291fac086e7745e1a",
            measurementId: "G-XES7XSYE2V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Compresor automático de imágenes para evitar exceder el límite de Firestore
        window.comprimirYConvertirImagen = function(event) {
            const archivo = event.target.files[0];
            if (!archivo) return;

            const lector = new FileReader();
            lector.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    // Definir un tamaño máximo ideal para perfiles (ej. 300x300 píxeles)
                    const MAX_WIDTH = 300;
                    const MAX_HEIGHT = 300;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    // Comprimir a formato JPEG con calidad 0.7 (reduce drásticamente el peso a pocos KB)
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

                    document.getElementById('inputFotoBase64').value = dataUrl;
                    document.getElementById('previewFoto').src = dataUrl;
                    document.getElementById('previewFoto').classList.remove('hidden');
                    document.getElementById('previewIcon').classList.add('hidden');
                };
                img.src = e.target.result;
            };
            lector.readAsDataURL(archivo);
        };

        window.agregarCampoServicio = function(nombre = '', precio = '') {
            const contenedor = document.getElementById('contenedorServiciosDinamicos');
            const div = document.createElement('div');
            div.className = "flex gap-3 items-center item-servicio";
            div.innerHTML = `
                <input type="text" placeholder="Nombre del procedimiento (Ej. Limpieza)" value="${nombre}" class="input-nombre-serv flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#26bad4] outline-none text-sm" required>
                <input type="text" placeholder="Precio (Ej. $850)" value="${precio}" class="input-precio-serv w-32 px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#26bad4] outline-none text-sm" required>
                <button type="button" onclick="this.parentElement.remove()" class="text-slate-400 hover:text-red-500 px-2 py-1"><i class="fa-solid fa-trash"></i></button>
            `;
            contenedor.appendChild(div);
        };

        async function cargarMiPerfil() {
            try {
                const querySnapshot = await getDocs(collection(db, "dentistas"));
                if (!querySnapshot.empty) {
                    const docPerfil = querySnapshot.docs[0];
                    const datos = docPerfil.data();
                    const id = docPerfil.id;

                    document.getElementById('inputIdFirebase').value = id;
                    document.getElementById('inputNombre').value = (datos.nombre || '').replace(/^Dr\.\s*|Dra\.\s*/i, '');
                    document.getElementById('inputEspecialidad').value = datos.especialidad || '';
                    document.getElementById('inputCorreo').value = datos.correo || '';
                    document.getElementById('inputPassword').value = datos.password || '';
                    
                    if (datos.foto) {
                        document.getElementById('inputFotoBase64').value = datos.foto;
                        document.getElementById('previewFoto').src = datos.foto;
                        document.getElementById('previewFoto').classList.remove('hidden');
                        document.getElementById('previewIcon').classList.add('hidden');
                    }

                    document.getElementById('sidebarNombre').innerText = datos.nombre || 'Especialista';
                    document.getElementById('sidebarAvatar').innerText = (datos.nombre || 'DR').substring(0, 2).toUpperCase();

                    const contenedorServicios = document.getElementById('contenedorServiciosDinamicos');
                    contenedorServicios.innerHTML = '';
                    if (datos.servicios && datos.servicios.length > 0) {
                        datos.servicios.forEach(s => agregarCampoServicio(s.nombre, s.precio));
                    } else {
                        agregarCampoServicio();
                    }
                }
            } catch (error) {
                console.error("Error al cargar perfil:", error);
            }
        }

        cargarMiPerfil();

        window.guardarMiPerfil = async function(event) {
            event.preventDefault();
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando cambios...';
            btnSubmit.disabled = true;

            let nombreIngresado = document.getElementById('inputNombre').value.trim();
            if (!nombreIngresado.toLowerCase().startsWith('dr.') && !nombreIngresado.toLowerCase().startsWith('dra.')) {
                nombreIngresado = "Dr. " + nombreIngresado;
            }

            const serviciosArray = [];
            document.querySelectorAll('.item-servicio').forEach(item => {
                const nombreServ = item.querySelector('.input-nombre-serv').value;
                const precioServ = item.querySelector('.input-precio-serv').value;
                if (nombreServ && precioServ) {
                    serviciosArray.push({ nombre: nombreServ, precio: precioServ });
                }
            });

            const idFirebase = document.getElementById('inputIdFirebase').value;
            const datosActualizados = {
                nombre: nombreIngresado,
                especialidad: document.getElementById('inputEspecialidad').value,
                correo: document.getElementById('inputCorreo').value,
                password: document.getElementById('inputPassword').value,
                foto: document.getElementById('inputFotoBase64').value,
                servicios: serviciosArray
            };

            try {
                await updateDoc(doc(db, "dentistas", idFirebase), datosActualizados);
                alert("¡Tus cambios y tu foto se han guardado correctamente!");
                location.reload();
            } catch (error) {
                alert("Error al guardar: " + error.message);
                btnSubmit.innerHTML = '<i class="fa-solid fa-save"></i> Guardar Cambios en mi Perfil';
                btnSubmit.disabled = false;
            }
        };
    </script>
</body>
</html>
